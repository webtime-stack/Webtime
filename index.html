<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบลงเวลาพนักงาน</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #d62f4f; --brand-dark: #b5233f; --ink: #1f2430; --muted: #6f7584;
    --card: #fff; --line: #f0e4e9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Bai Jamjuree", "Sarabun", system-ui, sans-serif; color: var(--ink); min-height: 100vh;
    background: linear-gradient(180deg, #fdf1f5 0%, #faf6f8 45%, #fbf8f9 100%);
    overflow-x: hidden;
  }

  /* พื้นหลังลอย */
  .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .55; pointer-events: none; z-index: 0; }
  .blob.b1 { width: 380px; height: 380px; background: #ffc2d0; top: -120px; left: -100px; }
  .blob.b2 { width: 320px; height: 320px; background: #ffd9e2; bottom: -120px; right: -90px; }

  /* แถบบน */
  .nav {
    position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; max-width: 1100px; margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--brand); font-size: 17px; }
  .brand-ic {
    width: 40px; height: 40px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg,#ff7a93,#d62f4f); color: #fff;
    box-shadow: 0 8px 16px rgba(214,47,79,.35), inset 0 1px 0 rgba(255,255,255,.45);
  }

  /* ฮีโร่ */
  .hero {
    position: relative; z-index: 1; min-height: calc(100vh - 90px); max-width: 1100px; margin: 0 auto;
    padding: 20px 24px 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .ghost {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); white-space: nowrap;
    font-size: clamp(90px, 18vw, 220px); font-weight: 800; color: rgba(214,47,79,.07);
    pointer-events: none; z-index: 0; user-select: none;
  }
  .copy { position: relative; z-index: 1; }
  .eyebrow {
    display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: var(--brand);
    background: #fff; border-radius: 999px; padding: 7px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.05); margin-bottom: 18px;
  }
  .title {
    margin: 0; font-size: clamp(38px, 7vw, 72px); font-weight: 800; line-height: 1.12; overflow: hidden;
  }
  .title span { display: block; }
  .title span + span { color: var(--brand); }
  .desc { margin: 16px auto 0; max-width: 520px; color: var(--muted); font-size: 16px; line-height: 1.6; }

  /* นาฬิกาลอย */
  .float-wrap { position: relative; z-index: 1; margin: 26px 0 8px; }
  #hero-clock { width: 150px; height: 150px; filter: drop-shadow(0 22px 26px rgba(214,47,79,.25)); }

  /* ตัวเลือกทางเข้า */
  .choices {
    position: relative; z-index: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px;
    width: 100%; max-width: 760px; margin-top: 18px; perspective: 900px;
  }
  .choice {
    display: block; text-align: left; text-decoration: none; color: var(--ink);
    background: var(--card); border-radius: 22px; padding: 24px; box-shadow: 0 8px 22px rgba(0,0,0,.05);
    transform-style: preserve-3d; transition: box-shadow .3s ease;
  }
  .choice:hover { box-shadow: 0 18px 36px rgba(214,47,79,.16); }
  .choice-ic {
    width: 56px; height: 56px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg,#ffd6df,#fb9fb3); color: #b5233f;
    box-shadow: 0 10px 18px rgba(214,47,79,.28), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .choice h2 { margin: 16px 0 6px; font-size: 19px; font-weight: 800; }
  .choice p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .choice .go {
    margin-top: 18px; display: inline-flex; align-items: center; gap: 8px; color: var(--brand); font-weight: 700; font-size: 14px;
  }
  .choice .go span {
    width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .choice.admin .choice-ic { background: linear-gradient(145deg,#d9dcff,#9aa3f5); color: #2e3a9a; box-shadow: 0 10px 18px rgba(46,58,154,.22), inset 0 1px 0 rgba(255,255,255,.7); }
  .choice.admin .go { color: #2e3a9a; }
  .choice.admin .go span { background: #2e3a9a; }

  footer { position: relative; z-index: 1; text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 24px; }

  @media (max-width: 640px) {
    .choices { grid-template-columns: 1fr; }
    .nav { padding: 16px 18px; }
    #hero-clock { width: 118px; height: 118px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob { display: none; }
  }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<nav class="nav">
  <div class="brand">
    <span class="brand-ic">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    </span>
    ระบบลงเวลาพนักงาน
  </div>
</nav>

<section class="hero">
  <div class="ghost" id="ghost">ลงเวลา</div>


  <div class="float-wrap">
    <svg id="hero-clock" viewBox="0 0 160 160" aria-hidden="true">
      <defs>
        <linearGradient id="faceG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff8aa1"/>
          <stop offset="1" stop-color="#d62f4f"/>
        </linearGradient>
      </defs>
      <circle cx="80" cy="80" r="70" fill="url(#faceG)"/>
      <circle cx="80" cy="80" r="56" fill="#fff" fill-opacity=".96"/>
      <g stroke="#e8c9d2" stroke-width="3" stroke-linecap="round">
        <line x1="80" y1="30" x2="80" y2="38"/>
        <line x1="130" y1="80" x2="122" y2="80"/>
        <line x1="80" y1="130" x2="80" y2="122"/>
        <line x1="30" y1="80" x2="38" y2="80"/>
      </g>
      <line id="hand-h" x1="80" y1="80" x2="80" y2="54" stroke="#1f2430" stroke-width="5" stroke-linecap="round"/>
      <line id="hand-m" x1="80" y1="80" x2="108" y2="80" stroke="#d62f4f" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="80" cy="80" r="5" fill="#1f2430"/>
    </svg>
  </div>

  <div class="choices">
    <a class="choice" href="clock.html" data-tilt>
      <div class="choice-ic">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.3-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2 .4 3.4 2 4 4.5"/></svg>
      </div>
      <h2>ลงเวลาพนักงาน</h2>
      <p>เลือกชื่อ กรอกรหัส PIN แล้วบันทึกเวลาเข้า-ออกกะของวันนี้</p>
      <div class="go">เริ่มลงเวลา <span>→</span></div>
    </a>

    <a class="choice admin" href="admin.html" data-tilt>
      <div class="choice-ic">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l2 2M14 9l2 2"/></svg>
      </div>
      <h2>ผู้ดูแลระบบ</h2>
      <p>เข้าสู่ระบบเพื่อดูรายงานค่าแรง จัดการพนักงาน และผู้ดูแลระบบ</p>
      <div class="go">เข้าสู่ระบบ <span>→</span></div>
    </a>
  </div>
</section>

<footer>© ระบบลงเวลาพนักงาน</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

if (window.gsap && !reduce) {
  // ลำดับการเปิดหน้า: ข้อความเลื่อนขึ้นทีละบรรทัด แล้วนาฬิกาหมุนเข้าที่
  const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
  tl.from('#hero-clock', { scale: .6, rotate: -25, opacity: 0, duration: 1.1, ease: 'back.out(1.4)' })
    .from('.choice', { y: 36, opacity: 0, stagger: .15, duration: .7 }, '-=.6');

  // เข็มนาฬิกาเดินจริง (ชั่วโมงและนาทีตามเวลาไทย)
  function moveHands() {
    const d = new Date(Date.now() + 7 * 3600 * 1000);
    const mins = d.getUTCMinutes(), hrs = d.getUTCHours() % 12;
    const mAng = mins * 6 * Math.PI / 180, hAng = (hrs + mins / 60) * 30 * Math.PI / 180;
    gsap.to('#hand-m', { duration: .6, attr: { x2: 80 + 28 * Math.sin(mAng), y2: 80 - 28 * Math.cos(mAng) } });
    gsap.to('#hand-h', { duration: .6, attr: { x2: 80 + 26 * Math.sin(hAng), y2: 80 - 26 * Math.cos(hAng) } });
  }
  moveHands();
  setInterval(moveHands, 30000);

  // นาฬิกาลอยขึ้นลงเบาๆ
  gsap.to('#hero-clock', { y: -14, rotate: 4, duration: 2.6, yoyo: true, repeat: -1, ease: 'sine.inOut' });

  // คำใหญ่ด้านหลังเปลี่ยนสลับไปมา
  const words = ['ลงเวลา', 'ค่าแรง', 'ผู้ดูแล'];
  const ghost = document.getElementById('ghost');
  let i = 0;
  setInterval(() => {
    gsap.to(ghost, {
      xPercent: -8, opacity: 0, duration: .4, ease: 'power2.in',
      onComplete: () => {
        i = (i + 1) % words.length;
        ghost.textContent = words[i];
        gsap.fromTo(ghost, { xPercent: 8, opacity: 0 }, { xPercent: 0, opacity: 1, duration: .6, ease: 'power3.out' });
      }
    });
  }, 3200);

  // การ์ดเอียงตามตำแหน่งเมาส์
  document.querySelectorAll('[data-tilt]').forEach(el => {
    const rx = gsap.quickTo(el, 'rotationX', { duration: .4, ease: 'power2.out' });
    const ry = gsap.quickTo(el, 'rotationY', { duration: .4, ease: 'power2.out' });
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5;
      const y = (e.clientY - r.top) / r.height - .5;
      ry(x * 12);
      rx(-y * 12);
    });
    el.addEventListener('pointerleave', () => { rx(0); ry(0); });
  });
}
</script>
</body>
</html>
