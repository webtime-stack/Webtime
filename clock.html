<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลงเวลาทำงาน</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #d62f4f; --brand-dark: #b5233f; --brand-soft: #fde9ee;
    --bg: #faf5f7; --card: #fff; --ink: #1f2430; --muted: #6f7584; --line: #f0e4e9;
    --green: #15803d; --red: #d62f4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Bai Jamjuree", "Sarabun", system-ui, sans-serif; font-size: 15px;
    color: var(--ink); -webkit-text-size-adjust: 100%; min-height: 100vh;
    background: linear-gradient(180deg, #fdf1f5 0%, #faf6f8 40%, #fbf8f9 100%) fixed;
  }
  .hidden { display: none !important; }

  /* ---------- แถบบน ---------- */
  .topbar {
    height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 20px;
    background: rgba(255,255,255,.7); backdrop-filter: blur(6px); position: sticky; top: 0; z-index: 10;
  }
  .brand-ic {
    width: 40px; height: 40px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg,#ff7a93,#d62f4f); color: #fff;
    box-shadow: 0 8px 16px rgba(214,47,79,.35), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .brand-t { color: var(--brand); font-weight: 800; font-size: 17px; }
  .brand-s { color: var(--muted); font-size: 12px; }

  main { max-width: 560px; margin: 0 auto; padding: 18px 16px 48px; }

  .title-block { border-left: 6px solid var(--brand); padding-left: 14px; margin: 8px 0 22px; }
  .title-block h1 { margin: 0; font-size: 24px; font-weight: 800; }
  .title-block .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  /* ---------- การ์ด ---------- */
  .card {
    background: var(--card); border-radius: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.04);
    padding: 22px; position: relative; overflow: hidden;
  }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .card-head .ic {
    width: 44px; height: 44px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg,#ffd6df,#fb9fb3); color: #b5233f;
    box-shadow: 0 8px 16px rgba(214,47,79,.25), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .card-head h2 { margin: 0; font-size: 17px; font-weight: 800; }
  .card-head .hint { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .ic svg, .brand-ic svg, .success-ic svg, .loader svg { filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 11px 13px; border: 1px solid #ebdfe4; border-radius: 12px;
    font: inherit; font-size: 16px; background: #fff; color: var(--ink);
  }
  input:focus, select:focus { outline: 3px solid rgba(214,47,79,.15); border-color: var(--brand); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    width: 100%; margin-top: 8px; padding: 13px; border: 0; border-radius: 12px; cursor: pointer;
    background: linear-gradient(145deg,#ff7a93,#d62f4f); color: #fff; font: inherit; font-size: 16px; font-weight: 700;
    box-shadow: 0 10px 20px rgba(214,47,79,.28), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .btn:hover { filter: brightness(.97); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.outline {
    background: #fff; color: var(--ink); border: 1px solid #ebdfe4; box-shadow: none; font-weight: 600;
  }

  .msg { margin-top: 14px; padding: 10px 13px; border-radius: 12px; font-size: 14px; display: none; }
  .msg.ok { display: block; background: #e8f7ee; color: var(--green); }
  .msg.bad { display: block; background: #fdecef; color: var(--red); }

  /* ---------- แถบโหลด ---------- */
  .loader { background: transparent; text-align: center; margin: 40px auto; max-width: 420px; padding: 20px; }
  .loader-label { color: var(--muted); font-size: 13px; letter-spacing: 3px; font-weight: 700; margin-bottom: 14px; text-transform: uppercase; }
  .loader-track {
    position: relative; height: 22px; border-radius: 999px; background: #f4eaee;
    border: 2px solid #ecdfe4; overflow: hidden;
  }
  .loader-bar {
    position: absolute; left: 4px; top: 4px; bottom: 4px; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, #e0168b 0%, #ff3b5c 60%, #ff5a3c 100%);
    box-shadow: 0 0 14px rgba(255,60,92,.45);
    animation: loaderFill 1.6s ease-in-out infinite;
  }
  .loader-bar::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    animation: loaderShine 1.2s linear infinite;
  }
  @keyframes loaderFill { 0% { width: 0; } 70% { width: 72%; } 100% { width: 72%; } }
  @keyframes loaderShine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .overlay {
    position: absolute; inset: 0; background: rgba(255,255,255,.85); border-radius: 18px;
    display: flex; align-items: center; justify-content: center; z-index: 5;
  }
  .overlay .loader { margin: 0; width: 90%; max-width: 360px; padding: 26px 24px; background: #fff; border-radius: 18px; box-shadow: 0 16px 40px rgba(0,0,0,.12); }

  /* ---------- หน้าสำเร็จ ---------- */
  .success { text-align: center; padding: 34px 20px; }
  .success-ic {
    width: 76px; height: 76px; border-radius: 24px; margin: 0 auto 16px; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg,#c9f3d6,#6fd394); color: #0f6b33;
    box-shadow: 0 12px 22px rgba(21,128,61,.25), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .success h3 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
  .success p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" style="text-decoration:none;color:#6f7584;font-size:14px;margin-right:6px">← หน้าแรก</a>
  <span class="brand-ic">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
  </span>
  <div>
    <div class="brand-t">ระบบลงเวลาพนักงาน</div>
    <div class="brand-s">บันทึกเวลาเข้า-ออกกะ</div>
  </div>
</header>

<main>
  <!-- แถบโหลดตอนเปิดหน้า -->
  <div id="initLoader">
    <div class="loader">
      <div class="loader-label">LOADING</div>
      <div class="loader-track"><div class="loader-bar"></div></div>
    </div>
  </div>

  <!-- ฟอร์มลงเวลา -->
  <div id="formCard" class="hidden">
    <div class="title-block">
      <h1>ลงเวลาวันนี้</h1>
      <div class="sub">เลือกชื่อ กรอก PIN แล้วบันทึกเวลาเข้า-ออก</div>
    </div>

    <div class="card">
      <div id="saveOverlay" class="overlay hidden">
        <div class="loader">
          <div class="loader-label">SAVING</div>
          <div class="loader-track"><div class="loader-bar"></div></div>
        </div>
      </div>

      <div class="card-head">
        <span class="ic">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.3-5 6.5-5s5.7 1.8 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2 .4 3.4 2 4 4.5"/></svg>
        </span>
        <div>
          <h2>ข้อมูลพนักงาน</h2>
          <div class="hint">ยืนยันตัวตนด้วยรหัส PIN ของคุณ</div>
        </div>
      </div>

      <div class="field">
        <label for="name">ชื่อพนักงาน</label>
        <select id="name"></select>
      </div>

      <div class="field">
        <label for="pin">รหัส PIN</label>
        <input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
      </div>

      <div class="row">
        <div class="field">
          <label for="date">วันที่</label>
          <input id="date" type="date">
        </div>
        <div class="field">
          <label for="shift">กะ</label>
          <select id="shift">
            <option>กะเช้า</option>
            <option>กะบ่าย</option>
            <option>กะดึก</option>
            <option>กะพัก</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="start">เวลาเข้า</label>
          <input id="start" type="time">
        </div>
        <div class="field">
          <label for="end">เวลาออก</label>
          <input id="end" type="time">
        </div>
      </div>

      <div class="field">
        <label for="breakMin">เวลาพัก (นาที)</label>
        <input id="breakMin" type="number" inputmode="numeric" min="0" value="0">
      </div>

      <button id="submitClock" class="btn">บันทึกเวลา</button>
      <div id="staffMsg" class="msg"></div>
    </div>
  </div>

  <!-- หลังบันทึกสำเร็จ -->
  <div id="successCard" class="card success hidden">
    <div class="success-ic">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>
    </div>
    <h3>บันทึกเวลาเรียบร้อยแล้ว</h3>
    <p id="successText"></p>
    <button id="againBtn" class="btn outline" style="margin-top:0">ลงเวลาอีกครั้ง</button>
  </div>
</main>

<script>
/* ใส่ URL ของ Web App จาก Apps Script ที่นี่ (ต้องเหมือนกับในไฟล์ admin.html) */
const API_URL = 'https://script.google.com/macros/s/AKfycbxZymhGOVJPyHOE9DUTrqEgjt6n1Dn4CzGAsN-OgtA_mrd2EFFIR_oHSe8ijKVFSzKe/exec';

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function showMsg(el, text, ok) {
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'bad');
}
function todayISO() {
  return new Date(Date.now() + 7 * 3600 * 1000).toISOString().slice(0, 10);
}
function thaiDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return `${d}/${m}/${y + 543}`;
}
async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(API_URL + '?' + qs);
  return r.json();
}
async function apiPost(body) {
  // ใช้ text/plain เพื่อหลีกเลี่ยง CORS preflight กับ Apps Script
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return r.json();
}

/* ---------- โหลดรายชื่อตอนเปิดหน้า ---------- */
async function loadNames() {
  try {
    const res = await apiGet({ action: 'employees' });
    $('name').innerHTML = '<option value="">-- เลือกชื่อ --</option>' +
      res.names.map(n => `<option>${esc(n)}</option>`).join('');
  } catch (e) {
    $('name').innerHTML = '<option value="">โหลดรายชื่อไม่สำเร็จ</option>';
  } finally {
    $('initLoader').classList.add('hidden');
    $('formCard').classList.remove('hidden');
  }
}

$('date').value = todayISO();

/* ---------- บันทึกเวลา ---------- */
$('submitClock').addEventListener('click', async () => {
  const btn = $('submitClock');
  const msg = $('staffMsg');
  const data = {
    action: 'clock',
    name: $('name').value,
    pin: $('pin').value.trim(),
    date: $('date').value,
    shift: $('shift').value,
    start: $('start').value,
    end: $('end').value,
    breakMin: $('breakMin').value
  };
  msg.className = 'msg';
  if (!data.name) return showMsg(msg, 'กรุณาเลือกชื่อ', false);
  if (!data.pin) return showMsg(msg, 'กรุณากรอกรหัส PIN', false);
  if (!data.date || !data.start || !data.end) return showMsg(msg, 'กรุณากรอกวันที่และเวลาให้ครบ', false);

  btn.disabled = true;
  $('saveOverlay').classList.remove('hidden');
  try {
    const res = await apiPost(data);
    if (res.ok) {
      $('successText').textContent = `${data.name} · ${thaiDate(data.date)} · ${data.shift}`;
      $('formCard').classList.add('hidden');
      $('successCard').classList.remove('hidden');
    } else {
      showMsg(msg, res.error, false);
    }
  } catch (e) {
    showMsg(msg, 'เชื่อมต่อไม่ได้ กรุณาลองใหม่', false);
  } finally {
    btn.disabled = false;
    $('saveOverlay').classList.add('hidden');
  }
});

/* ---------- ลงเวลาอีกครั้ง ---------- */
$('againBtn').addEventListener('click', () => {
  $('pin').value = '';
  $('start').value = '';
  $('end').value = '';
  $('breakMin').value = '0';
  $('staffMsg').className = 'msg';
  $('successCard').classList.add('hidden');
  $('formCard').classList.remove('hidden');
});

loadNames();
</script>
</body>
</html>
